<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سامانه مدیریت مدرسه</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="dist/style.css" rel="stylesheet">
</head>
<body class="bg-snow text-ink dark:bg-night dark:text-snow font-sans">

  <!-- دکمه‌ی دارک/لایت (بدون جاوااسکریپت) -->
  <input type="checkbox" id="theme-toggle" class="hidden">

  <div class="flex min-h-screen">

    <!-- ===== سایدبار (سمت راست چون RTL) ===== -->
    <aside class="w-64 shrink-0 bg-deep text-white flex flex-col p-4">
      <div class="flex items-center gap-2 px-2 py-4 text-lg font-bold">
        <span class="text-2xl">🎓</span>
        <span>مدیریت مدرسه</span>
      </div>

      <nav class="mt-4 flex flex-col gap-1 text-sm">
        <a href="#" class="rounded-xl bg-royal px-4 py-3 font-semibold">داشبورد</a>
        <a href="#" class="rounded-xl px-4 py-3 hover:bg-white/10">ثبت نمرات</a>
        <a href="#" class="rounded-xl px-4 py-3 hover:bg-white/10">دانش‌آموزان</a>
        <a href="#" class="rounded-xl px-4 py-3 hover:bg-white/10">معلمان</a>
        <a href="#" class="rounded-xl px-4 py-3 hover:bg-white/10">کلاس‌ها</a>
        <a href="#" class="rounded-xl px-4 py-3 hover:bg-white/10">امور مالی</a>
        <a href="#" class="rounded-xl px-4 py-3 hover:bg-white/10">اعلان‌ها</a>
        <a href="#" class="rounded-xl px-4 py-3 hover:bg-white/10">تنظیمات</a>
      </nav>
    </aside>

    <!-- ===== بخش اصلی ===== -->
    <div class="flex-1 flex flex-col">

      <!-- هدر -->
      <header class="flex items-center justify-between gap-4 bg-white dark:bg-ink px-6 py-4 shadow-sm">

        <!-- نوار جستجو (ظاهری) -->
        <div class="flex items-center gap-2 rounded-xl bg-mist dark:bg-night px-4 py-2 w-full max-w-sm">
          <span>🔍</span>
          <input type="text" placeholder="جستجو در سامانه..." class="bg-transparent outline-none w-full text-sm">
        </div>

        <div class="flex items-center gap-4">

          <!-- دکمه‌ی تم -->
          <label for="theme-toggle" class="cursor-pointer text-xl" title="تغییر تم">🌓</label>

          <!-- منوی اعلان‌ها -->
          <details class="relative">
            <summary class="list-none cursor-pointer text-xl relative">
              🔔
              <span class="absolute -top-2 -left-2 flex h-5 w-5 items-center justify-center rounded-full bg-red-500 text-xs text-white">3</span>
            </summary>
            <div class="absolute left-0 mt-3 w-72 rounded-xl bg-white dark:bg-ink p-3 text-sm shadow-lg z-10">
              <p class="rounded-lg p-2 hover:bg-mist dark:hover:bg-night">جلسه اولیا و مربیان فردا برگزار می‌شود</p>
              <p class="rounded-lg p-2 hover:bg-mist dark:hover:bg-night">ثبت نمرات میان‌ترم الزامی است</p>
              <p class="rounded-lg p-2 hover:bg-mist dark:hover:bg-night">پرداخت شهریه معوقه</p>
            </div>
          </details>

          <!-- اطلاعات کاربر -->
          <div class="flex items-center gap-2">
            <div class="flex h-10 w-10 items-center justify-center rounded-full bg-brand text-white font-bold">ع</div>
            <div class="text-sm leading-tight">
              <p class="font-semibold">رعنا اکبری</p>
              <p class="text-xs opacity-70">مدیر مدرسه</p>
            </div>
          </div>
        </div>
      </header>

      <!-- ===== محتوا از اینجا شروع می‌شود ===== -->
      <main class="flex-1 p-6">
        <h1 class="text-2xl font-bold text-brand">رزرو جلسه اولیا و مربیان</h1>
     <div class="bg-white rounded-2xl shadow-sm p-6 mt-6">

  <h2 class="text-xl font-bold text-ink mb-6">
    فرم رزرو جلسه با معلم
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

    <div>
      <label class="block text-sm font-bold text-ink mb-2">
        نام و نام خانوادگی والد
      </label>
      <input type="text" placeholder="نام والد را وارد کنید"
        class="w-full border border-gray-200 rounded-xl p-3">
    </div>

    <div>
      <label class="block text-sm font-bold text-ink mb-2">
        نام دانش‌آموز
      </label>
      <input type="text" placeholder="نام دانش‌آموز را وارد کنید"
        class="w-full border border-gray-200 rounded-xl p-3">
    </div>

    <div>
      <label class="block text-sm font-bold text-ink mb-2">
        نام معلم
      </label>
      <select class="w-full border border-gray-200 rounded-xl p-3">
        <option>انتخاب معلم</option>
        <option>مریم احمدی</option>
        <option>زهرا محمدی</option>
        <option>علی رضایی</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-bold text-ink mb-2">
        شماره تماس
      </label>
      <input type="tel" placeholder="شماره تماس"
        class="w-full border border-gray-200 rounded-xl p-3">
    </div>

    <div>
      <label class="block text-sm font-bold text-ink mb-2">
        تاریخ جلسه
      </label>
      <input type="text" placeholder="مثلاً ۱۴۰۵/۰۹/۲۰"
        class="w-full border border-gray-200 rounded-xl p-3">
    </div>

    <div>
      <label class="block text-sm font-bold text-ink mb-2">
        ساعت جلسه
      </label>
      <select class="w-full border border-gray-200 rounded-xl p-3">
        <option>انتخاب ساعت</option>
        <option>۱۰:۰۰</option>
        <option>۱۱:۰۰</option>
        <option>۱۲:۰۰</option>
      </select>
    </div>

  </div>

  <div class="mt-5">
    <label class="block text-sm font-bold text-ink mb-2">
      موضوع جلسه
    </label>
    <textarea rows="4" placeholder="موضوع جلسه را بنویسید"
      class="w-full border border-gray-200 rounded-xl p-3"></textarea>
  </div>

  <div class="mt-6 flex justify-end">
    <button class="bg-brand text-white px-6 py-3 rounded-xl">
      ثبت درخواست جلسه
    </button>
  </div>

</div>
      </main>
      <!-- ===== پایان محتوا ===== -->

    </div>
  </div>

</body>
</html>
